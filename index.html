<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerie de prompts visuels</title>
<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #182033;
  --muted: #667085;
  --border: #d9e0ea;
  --accent: #2563eb;
  --accent-soft: #e8f0ff;
  --shadow: 0 10px 30px rgba(18, 24, 40, .08);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #ffffff 0, var(--bg) 42%);
  color: var(--text);
}
.page {
  width: min(1280px, calc(100% - 28px));
  margin: 0 auto;
  padding: 24px 0 60px;
}
.hero {
  background: linear-gradient(135deg, #ffffff, #edf4ff);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 28px;
  margin-bottom: 18px;
}
.hero h1 {
  margin: 0 0 8px;
  font-size: clamp(1.8rem, 4vw, 3rem);
  letter-spacing: -0.04em;
}
.hero p { color: var(--muted); margin: 0; line-height: 1.5; }
.stats {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 18px;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 16px;
  min-width: 130px;
}
.stat strong { display: block; font-size: 1.4rem; }
.stat span { color: var(--muted); font-size: .9rem; }
.toolbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(244, 246, 251, .88);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 22px;
}
.toolbar-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: center;
}
.search {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 1rem;
  background: var(--card);
}
select, button {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 12px;
  padding: 11px 13px;
  font-weight: 700;
}
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--accent); color: var(--accent); }
.filter-row, .page-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
  max-height: 180px;
  overflow-y: auto;
  padding-bottom: 2px;
}
.chip {
  border-radius: 999px;
  padding: 8px 12px;
  font-size: .9rem;
  background: var(--card);
}
.chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.counter {
  margin: 0 0 14px;
  color: var(--muted);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 18px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 100%;
  height: 100%;
}
.card-header {
  padding: 16px 16px 10px;
}
.card h2 {
  font-size: 1.15rem;
  margin: 0 0 10px;
  letter-spacing: -0.02em;
  text-align: center;
}
.meta {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.badge {
  background: var(--accent-soft);
  color: #174ea6;
  border-radius: 999px;
  padding: 5px 8px;
  font-size: .78rem;
  font-weight: 700;
}
.thumb-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 8px;
  padding: 0 16px 12px;
}
.thumb {
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  background: #111;
  position: relative;
  min-height: 145px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.thumb img {
  width: 100%;
  height: 210px;
  object-fit: contain;
  display: block;
  cursor: zoom-in;
}
.thumb span {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: 8px;
  margin: 0 auto;
  width: fit-content;
  max-width: calc(100% - 16px);
  background: rgba(0,0,0,.72);
  color: white;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: .75rem;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.prompt {
  margin: 0 16px 14px;
  color: #303849;
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  line-height: 1.45;
  height: 165px;
  overflow: auto;
  white-space: pre-wrap;
}
.prompt-actions {
  padding: 0 16px 14px;
}
.prompt-actions button {
  width: 100%;
}

.empty {
  display: none;
  background: var(--card);
  border: 1px dashed var(--border);
  border-radius: 18px;
  padding: 28px;
  text-align: center;
  color: var(--muted);
}
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(0,0,0,.92);
  align-items: center;
  justify-content: center;
  padding: 22px;
}
#lightbox img {
  max-width: 94vw;
  max-height: 88vh;
  object-fit: contain;
  border-radius: 12px;
  background: transparent;
}
#lightbox .close {
  position: fixed;
  top: 16px;
  right: 16px;
  background: white;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  background: #101828;
  color: white;
  border-radius: 999px;
  padding: 10px 14px;
  display: none;
  z-index: 1000;
}
@media (max-width: 760px) {
  .toolbar-row { grid-template-columns: 1fr; }
  .hero { padding: 20px; }
  .grid { grid-template-columns: 1fr; }
  .toolbar { border-radius: 0 0 18px 18px; margin-left: -14px; margin-right: -14px; }
}
</style>
</head>

<div class="page">

    </div>
  </header>

</div>

<div id="lightbox">

const CATEGORIES = [
  "Tous",
  ...Array.from(new Set(ITEMS.map(item => item.category))).sort((a, b) => a.localeCompare(b, "fr"))
];
const PAGES = ["Toutes"];
let activeCategory = "Tous";
let activePage = "Toutes";

const gallery = document.getElementById("gallery");
const search = document.getElementById("search");
const sort = document.getElementById("sort");
const counter = document.getElementById("counter");
const empty = document.getElementById("empty");

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[ch]));
}

function buildFilters() {
  const catBox = document.getElementById("categoryFilters");
  catBox.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "chip" + (cat === activeCategory ? " active" : "");
    btn.textContent = cat;
    btn.addEventListener("click", () => {
      activeCategory = cat;
      buildFilters();
      render();
    });
    catBox.appendChild(btn);
  });
}

function refreshFilters() {
  buildFilters();
}

function itemMatches(item, q) {
  const haystack = [item.title, item.prompt, item.category, ...item.images.map(i => i.label)].join(" ").toLowerCase();
  return haystack.includes(q);
}

function render() {
  const q = search.value.trim().toLowerCase();
  let results = ITEMS.filter(item => {
    const catOk = activeCategory === "Tous" || item.category === activeCategory;
    const pageOk = true;
    const searchOk = !q || itemMatches(item, q);
    return catOk && pageOk && searchOk;
  });

  if (sort.value === "title") results.sort((a,b) => a.title.localeCompare(b.title, "fr"));
  if (sort.value === "category") results.sort((a,b) => (a.category + a.title).localeCompare(b.category + b.title, "fr"));

  gallery.innerHTML = results.map(item => `
    <article class="card" id="${escapeHtml(item.id)}">
      <div class="card-header">
        <h2>${escapeHtml(item.title)}</h2>
        <div class="meta">
          <span class="badge">${escapeHtml(item.category)}</span>
        </div>
      </div>
      ${item.prompt ? `
        <div class="prompt">${escapeHtml(item.prompt)}</div>
        <div class="prompt-actions">
          <button type="button" class="copy-btn" data-prompt="${escapeHtml(item.prompt)}">Copier le prompt</button>
        </div>
      ` : ""}
      <div class="thumb-grid">
        ${item.images.map(img => `
          <button class="thumb" type="button" data-src="${escapeHtml(img.src)}" data-alt="${escapeHtml(img.alt)}">
            <img src="${escapeHtml(img.src)}" alt="${escapeHtml(img.alt)}" loading="lazy">
            <span>${escapeHtml(img.label)}</span>
          </button>
        `).join("")}
      </div>

    </article>
  `).join("");

  counter.textContent = `${results.length} résultat${results.length > 1 ? "s" : ""} affiché${results.length > 1 ? "s" : ""} sur ${ITEMS.length}`;
  empty.style.display = results.length ? "none" : "block";

  document.querySelectorAll(".thumb").forEach(btn => {
    btn.addEventListener("click", () => openLightbox(btn.dataset.src, btn.dataset.alt));
  });
  document.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.prompt || "");
        showToast("Prompt copié");
      } catch(e) {
        showToast("Copie impossible");
      }
    });
  });
}

function openLightbox(src, alt) {
  const lb = document.getElementById("lightbox");
  lb.querySelector("img").src = src;
  lb.querySelector("img").alt = alt || "";
  lb.style.display = "flex";
}
function closeLightbox() {
  const lb = document.getElementById("lightbox");
  lb.style.display = "none";
  lb.querySelector("img").src = "";
}
function showToast(text) {
  const toast = document.getElementById("toast");
  toast.textContent = text;
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 1400);
}

document.getElementById("lightbox").addEventListener("click", (e) => {
  if (e.target.id === "lightbox" || e.target.classList.contains("close")) closeLightbox();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLightbox();
});
search.addEventListener("input", render);
sort.addEventListener("change", render);
document.getElementById("reset").addEventListener("click", () => {
  search.value = "";
  sort.value = "original";
  activeCategory = "Tous";
  refreshFilters();
  render();
});

refreshFilters();
render();
</script>
